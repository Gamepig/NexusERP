name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci || yarn install || pnpm install
      - name: Run tests (Vitest/Jest)
        run: |
          npx vitest run --coverage || npx jest --coverage || yarn vitest run --coverage || yarn jest --coverage || pnpm vitest run --coverage || pnpm jest --coverage

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest coverage
      - name: Run pytest with coverage
        run: |
          coverage run -m pytest
          coverage report --fail-under=80 