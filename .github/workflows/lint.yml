name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci || yarn install || pnpm install
      - name: Run ESLint
        run: npx eslint . --ext .js,.jsx,.ts,.tsx || yarn eslint . --ext .js,.jsx,.ts,.tsx || pnpm eslint . --ext .js,.jsx,.ts,.tsx
      - name: Run Prettier
        run: npx prettier --check . || yarn prettier --check . || pnpm prettier --check .

  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8
      - name: Run black
        run: black --check .
      - name: Run isort
        run: isort --check-only .
      - name: Run flake8
        run: flake8 . 