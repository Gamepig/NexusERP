version: '3.8'

services:
  # NexusERP Go Fiber API
  nexus-erp-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-erp-api
    restart: unless-stopped
    environment:
      # Application
      APP_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      DEBUG: false
      
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: nexus_user
      DB_PASSWORD: nexus_secure_password
      DB_NAME: nexus_erp
      DB_SSLMODE: disable
      DB_MAX_OPEN_CONNS: 25
      DB_MAX_IDLE_CONNS: 5
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      REDIS_POOL_SIZE: 10
      REDIS_MIN_IDLE_CONNS: 2
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-nexus-erp-super-secret-jwt-key-2024}
      JWT_EXPIRATION: 24h
      JWT_REFRESH_EXPIRATION: 168h
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-nexus-erp-refresh-secret-key-2024}
      
      # Email (optional)
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      FROM_EMAIL: noreply@nexuserp.local
      FROM_NAME: NexusERP API
      
    ports:
      - "8082:8080"  # External:Internal - API service on 8082
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexus-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus_erp
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: nexus_secure_password
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_user -d nexus_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6381:6379"  # Avoid conflict with system redis
    volumes:
      - redis_data:/data
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # MailHog for development email testing
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: nexus-mailhog
    restart: unless-stopped
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    networks:
      - nexus-network

  # Adminer for database management
  adminer:
    image: adminer:4-standalone
    container_name: nexus-adminer
    restart: unless-stopped
    ports:
      - "8086:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - nexus-network
    depends_on:
      - postgres

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: nexus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443" 
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - nexus-erp-api
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge
    name: nexus-network

volumes:
  postgres_data:
    name: nexus_postgres_data
  redis_data:
    name: nexus_redis_data