version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: nexus-postgres
    environment:
      - POSTGRES_DB=nexus_erp
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=securepassword
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=C.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - nexus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_erp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    command: redis-server --requirepass redispassword
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage (S3 compatible)
  minio:
    image: minio/minio:latest
    container_name: nexus-minio
    environment:
      - MINIO_ROOT_USER=nexus
      - MINIO_ROOT_PASSWORD=miniopassword
    command: server /data --console-address ":9090"
    ports:
      - "9000:9000"  # API endpoint
      - "9090:9090"  # Web console
    volumes:
      - minio_data:/data
    networks:
      - nexus-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nexus-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - nexus-network
    restart: unless-stopped

  # Go Backend API
  go-backend:
    image: golang:1.23-alpine
    container_name: nexus-go-backend
    working_dir: /app
    command: ["sh", "-c", "go mod download && go run cmd/main.go"]
    volumes:
      - ./backend:/app
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - nexus-network
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=nexus_erp
      - DB_USER=nexus
      - DB_PASSWORD=securepassword
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redispassword
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=nexus
      - MINIO_SECRET_KEY=miniopassword
      - JWT_SECRET=NexusERP-2025-JWT-Secret-Key-For-Authentication-And-Authorization-System-Development
      - APP_ENV=development
      - APP_PORT=8080
      - APP_DEBUG=true
    restart: unless-stopped

  # PHP Laravel Frontend with Nginx
  laravel-frontend:
    image: php:8.2-fpm-alpine
    container_name: nexus-laravel-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    depends_on:
      - postgres
      - redis
      - go-backend
    networks:
      - nexus-network
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:YourLaravelAppKey=
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=nexus_erp
      - DB_USERNAME=nexus
      - DB_PASSWORD=securepassword
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redispassword
      - SESSION_DRIVER=database
      - CACHE_DRIVER=database
    restart: unless-stopped
    command: |
      sh -c "
        apk add --no-cache curl postgresql-dev
        docker-php-ext-install pdo pdo_pgsql
        if [ ! -f /usr/local/bin/composer ]; then
          curl -sS https://getcomposer.org/installer | php
          mv composer.phar /usr/local/bin/composer
        fi
        cd /app
        composer install --no-dev --optimize-autoloader
        php artisan key:generate --force
        php artisan config:clear
        php artisan route:clear
        php artisan view:clear
        php-fpm
      "

  # Laravel Web Server (Nginx for serving Laravel)
  laravel-web:
    image: nginx:alpine
    container_name: nexus-laravel-web
    ports:
      - "8083:80"
    volumes:
      - ./frontend:/var/www/html
      - ./nginx/laravel.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel-frontend
    networks:
      - nexus-network
    restart: unless-stopped

# Named volumes for persistent data
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  nginx_logs:
    driver: local

# Network for all services
networks:
  nexus-network:
    driver: bridge
    name: nexus-network