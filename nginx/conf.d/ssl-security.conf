# NexusERP SSL/TLS 安全配置
# 適用於生產環境的強化 SSL/TLS 設定

# SSL 協議版本限制 - 只允許 TLS 1.2 和 1.3
ssl_protocols TLSv1.2 TLSv1.3;

# 強化的加密套件配置
ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256';

# 伺服器優先選擇加密套件
ssl_prefer_server_ciphers on;

# SSL 會話配置
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP Stapling 設定
ssl_stapling on;
ssl_stapling_verify on;
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

# DH 參數檔案（需要生成）
ssl_dhparam /etc/nginx/ssl/dhparam.pem;

# 安全標頭配置
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Content Security Policy
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; font-src 'self' https://fonts.bunny.net; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

# 移除伺服器版本資訊
server_tokens off;
# more_clear_headers Server;  # 需要 headers-more-nginx-module 模組，標準 nginx:alpine 不支援

# 防止點擊劫持
add_header X-Frame-Options "SAMEORIGIN" always;

# 防止 MIME 類型混淆
add_header X-Content-Type-Options "nosniff" always;

# 跨源資源共享 (CORS) 安全設定
add_header Access-Control-Allow-Origin "https://your-domain.com" always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;

# 限制請求大小
client_max_body_size 10M;
client_body_buffer_size 128k;
client_header_buffer_size 3m;
large_client_header_buffers 4 256k;

# 超時設定
client_body_timeout 12;
client_header_timeout 12;
# keepalive_timeout 15;  # 已在主 nginx.conf 中定義為 65
send_timeout 10;

# 限制連接數
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=5r/s;

# 應用連接和請求限制
limit_conn conn_limit_per_ip 20;
limit_req zone=req_limit_per_ip burst=10 nodelay;

