<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusERP 圖表測試</title>
    <style>
        /* NexusERP Deep Dark Theme Colors */
        :root {
            --nexus-background-primary: #1a1d29;
            --nexus-background-secondary: #2d3142;
            --nexus-text-primary: #ffffff;
            --nexus-text-secondary: #94a3b8;
            --nexus-accent-green: #10b981;
            --nexus-accent-blue: #3b82f6;
            --nexus-accent-purple: #8b5cf6;
            --nexus-accent-orange: #f59e0b;
            --nexus-accent-red: #ef4444;
            --nexus-accent-cyan: #06b6d4;
            --nexus-accent-pink: #ec4899;
            --nexus-border: #374151;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--nexus-background-primary);
            color: var(--nexus-text-primary);
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 300px 300px;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .chart-container {
            background: var(--nexus-background-secondary);
            border-radius: 12px;
            padding: 20px;
            position: relative;
        }
        
        .chart-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--nexus-text-primary);
        }
        
        .chart-subtitle {
            font-size: 14px;
            color: var(--nexus-text-secondary);
            margin-bottom: 15px;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .status-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--nexus-background-secondary);
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid var(--nexus-accent-green);
        }
        
        #testResults {
            background: var(--nexus-background-secondary);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
        
        .test-result {
            margin: 5px 0;
            padding: 5px 10px;
            border-radius: 4px;
        }
        
        .success { background-color: rgba(16, 185, 129, 0.2); }
        .error { background-color: rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body>
    <div class="status-indicator">
        <div id="loadingStatus">🔄 載入 Chart.js...</div>
    </div>
    
    <div class="container">
        <h1>NexusERP 深色主題圖表測試</h1>
        <p>測試新的 Chart.js 3.9.1 深色主題實作</p>
        
        <div class="chart-grid">
            <div class="chart-container">
                <div class="chart-title">營收趨勢</div>
                <div class="chart-subtitle">過去7天營收表現</div>
                <canvas id="revenueChart"></canvas>
            </div>
            
            <div class="chart-container">
                <div class="chart-title">訂單狀態分布</div>
                <div class="chart-subtitle">訂單狀態統計</div>
                <canvas id="ordersChart"></canvas>
            </div>
            
            <div class="chart-container full-width">
                <div class="chart-title">庫存分析</div>
                <div class="chart-subtitle">前8名產品庫存量</div>
                <canvas id="inventoryChart"></canvas>
            </div>
        </div>
        
        <div id="testResults">
            <h3>測試結果</h3>
            <div id="resultsList"></div>
        </div>
    </div>
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    
    <script>
    // Test results tracking
    const testResults = [];
    
    function addTestResult(test, passed, message) {
        testResults.push({ test, passed, message });
        updateTestDisplay();
    }
    
    function updateTestDisplay() {
        const resultsList = document.getElementById('resultsList');
        resultsList.innerHTML = testResults.map(result => 
            `<div class="test-result ${result.passed ? 'success' : 'error'}">
                ${result.passed ? '✅' : '❌'} ${result.test}: ${result.message}
            </div>`
        ).join('');
    }
    
    // NexusERP 深色主題顏色配置 (與實際 dashboard.blade.php 相同)
    const NexusColors = {
        primary: {
            background: '#1a1d29',
            cardBackground: '#2d3142',
            secondaryBackground: '#252836',
        },
        accent: {
            purple: '#8b5cf6',
            blue: '#3b82f6',
            pink: '#ec4899',
            cyan: '#06b6d4',
            green: '#10b981',
            orange: '#f59e0b',
            red: '#ef4444'
        },
        text: {
            primary: '#ffffff',
            secondary: '#94a3b8',
            muted: '#64748b'
        },
        border: '#374151'
    };

    // Chart.js 深色主題默認配置 (與實際代碼相同)
    const nexusChartDefaults = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            legend: {
                labels: {
                    color: NexusColors.text.primary,
                    font: {
                        family: "'Inter', sans-serif",
                        size: 12
                    }
                }
            }
        },
        scales: {
            x: {
                ticks: {
                    color: NexusColors.text.secondary,
                    font: {
                        family: "'Inter', sans-serif"
                    }
                },
                grid: {
                    color: NexusColors.border,
                    borderColor: NexusColors.border
                }
            },
            y: {
                ticks: {
                    color: NexusColors.text.secondary,
                    font: {
                        family: "'Inter', sans-serif"
                    }
                },
                grid: {
                    color: NexusColors.border,
                    borderColor: NexusColors.border
                }
            }
        }
    };

    // 圖表初始化函數 (與實際代碼相同)
    function initNexusCharts() {
        console.log('[NexusERP] 開始初始化深色主題圖表...');
        
        // 檢查 Chart.js 是否可用
        if (typeof Chart === 'undefined') {
            addTestResult('Chart.js 載入', false, 'Chart.js 未載入');
            return;
        }
        addTestResult('Chart.js 載入', true, 'Chart.js 3.9.1 成功載入');

        try {
            // 1. 營收趨勢圖
            const revenueCtx = document.getElementById('revenueChart');
            if (revenueCtx) {
                new Chart(revenueCtx, {
                    type: 'line',
                    data: {
                        labels: ['週一', '週二', '週三', '週四', '週五', '週六', '週日'],
                        datasets: [{
                            label: '營收 (NT$)',
                            data: [120000, 190000, 85000, 150000, 95000, 145000, 180000],
                            borderColor: NexusColors.accent.green,
                            backgroundColor: NexusColors.accent.green + '20',
                            borderWidth: 3,
                            tension: 0.4,
                            fill: true,
                            pointBackgroundColor: NexusColors.accent.green,
                            pointBorderColor: NexusColors.primary.cardBackground,
                            pointBorderWidth: 2,
                            pointRadius: 6
                        }]
                    },
                    options: {
                        ...nexusChartDefaults,
                        plugins: {
                            ...nexusChartDefaults.plugins,
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: NexusColors.primary.cardBackground,
                                titleColor: NexusColors.text.primary,
                                bodyColor: NexusColors.text.secondary,
                                borderColor: NexusColors.border,
                                borderWidth: 1,
                                callbacks: {
                                    label: function(context) {
                                        return '營收: NT$' + context.parsed.y.toLocaleString();
                                    }
                                }
                            }
                        },
                        scales: {
                            ...nexusChartDefaults.scales,
                            y: {
                                ...nexusChartDefaults.scales.y,
                                ticks: {
                                    ...nexusChartDefaults.scales.y.ticks,
                                    callback: function(value) {
                                        return 'NT$' + (value / 1000) + 'K';
                                    }
                                }
                            }
                        }
                    }
                });
                addTestResult('營收趨勢圖', true, '綠色線圖成功初始化');
            } else {
                addTestResult('營收趨勢圖', false, '找不到 revenueChart 元素');
            }

            // 2. 訂單狀態分布圖
            const ordersCtx = document.getElementById('ordersChart');
            if (ordersCtx) {
                new Chart(ordersCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['已完成', '處理中', '待確認', '已取消'],
                        datasets: [{
                            data: [650, 250, 80, 20],
                            backgroundColor: [
                                NexusColors.accent.green,
                                NexusColors.accent.blue,
                                NexusColors.accent.orange,
                                NexusColors.accent.red
                            ],
                            borderColor: NexusColors.primary.cardBackground,
                            borderWidth: 3,
                            hoverOffset: 10
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    color: NexusColors.text.primary,
                                    font: {
                                        family: "'Inter', sans-serif",
                                        size: 12
                                    },
                                    padding: 20,
                                    usePointStyle: true
                                }
                            },
                            tooltip: {
                                backgroundColor: NexusColors.primary.cardBackground,
                                titleColor: NexusColors.text.primary,
                                bodyColor: NexusColors.text.secondary,
                                borderColor: NexusColors.border,
                                borderWidth: 1,
                                callbacks: {
                                    label: function(context) {
                                        const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                        const percentage = ((context.parsed / total) * 100).toFixed(1);
                                        return context.label + ': ' + context.parsed + ' (' + percentage + '%)';
                                    }
                                }
                            }
                        },
                        cutout: '60%'
                    }
                });
                addTestResult('訂單狀態圖', true, '環形圖成功初始化，包含百分比');
            } else {
                addTestResult('訂單狀態圖', false, '找不到 ordersChart 元素');
            }

            // 3. 庫存分析圖
            const inventoryCtx = document.getElementById('inventoryChart');
            if (inventoryCtx) {
                new Chart(inventoryCtx, {
                    type: 'bar',
                    data: {
                        labels: ['筆記型電腦', '印表機', '螢幕', '鍵盤', '滑鼠', '耳機', 'USB', '記憶卡'],
                        datasets: [{
                            label: '庫存量',
                            data: [120, 95, 87, 63, 45, 78, 234, 156],
                            backgroundColor: [
                                NexusColors.accent.purple + 'CC',
                                NexusColors.accent.blue + 'CC',
                                NexusColors.accent.green + 'CC',
                                NexusColors.accent.orange + 'CC',
                                NexusColors.accent.pink + 'CC',
                                NexusColors.accent.cyan + 'CC',
                                NexusColors.accent.red + 'CC',
                                NexusColors.accent.purple + '99'
                            ],
                            borderColor: [
                                NexusColors.accent.purple,
                                NexusColors.accent.blue,
                                NexusColors.accent.green,
                                NexusColors.accent.orange,
                                NexusColors.accent.pink,
                                NexusColors.accent.cyan,
                                NexusColors.accent.red,
                                NexusColors.accent.purple
                            ],
                            borderWidth: 2,
                            borderRadius: 4
                        }]
                    },
                    options: {
                        ...nexusChartDefaults,
                        plugins: {
                            ...nexusChartDefaults.plugins,
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: NexusColors.primary.cardBackground,
                                titleColor: NexusColors.text.primary,
                                bodyColor: NexusColors.text.secondary,
                                borderColor: NexusColors.border,
                                borderWidth: 1,
                                callbacks: {
                                    label: function(context) {
                                        return context.dataset.label + ': ' + context.parsed.y + ' 件';
                                    }
                                }
                            }
                        },
                        scales: {
                            ...nexusChartDefaults.scales,
                            x: {
                                ...nexusChartDefaults.scales.x,
                                ticks: {
                                    ...nexusChartDefaults.scales.x.ticks,
                                    maxRotation: 45,
                                    minRotation: 0
                                }
                            },
                            y: {
                                ...nexusChartDefaults.scales.y,
                                ticks: {
                                    ...nexusChartDefaults.scales.y.ticks,
                                    callback: function(value) {
                                        return value + ' 件';
                                    }
                                }
                            }
                        }
                    }
                });
                addTestResult('庫存分析圖', true, '多彩條形圖成功初始化');
            } else {
                addTestResult('庫存分析圖', false, '找不到 inventoryChart 元素');
            }

            // 測試深色主題顏色
            addTestResult('深色主題配色', true, '使用 NexusERP style.json 配色方案');
            
            // 測試響應式設計
            addTestResult('響應式設計', true, 'maintainAspectRatio: false 配置');
            
            // 最終狀態更新
            document.getElementById('loadingStatus').innerHTML = '✅ 圖表載入完成';
            
            console.log('[NexusERP] 🎉 所有圖表初始化完成');
            addTestResult('整體測試', true, '所有圖表成功初始化，深色主題正常');
            
        } catch (error) {
            console.error('[NexusERP] 圖表初始化錯誤:', error);
            addTestResult('圖表初始化', false, error.message);
        }
    }

    // 等待 DOM 和 Chart.js 載入完成後初始化圖表
    document.addEventListener('DOMContentLoaded', function() {
        console.log('[NexusERP] DOM 載入完成，等待 Chart.js...');
        
        // 檢查 Chart.js 是否已載入
        function checkAndInitCharts() {
            if (typeof Chart !== 'undefined') {
                console.log('[NexusERP] Chart.js 可用，初始化圖表...');
                initNexusCharts();
            } else {
                console.log('[NexusERP] 等待 Chart.js 載入...');
                setTimeout(checkAndInitCharts, 100);
            }
        }
        
        checkAndInitCharts();
    });
    </script>
</body>
</html>
