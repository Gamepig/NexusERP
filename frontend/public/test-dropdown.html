<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用戶下拉選單測試頁面</title>
    <!-- 載入編譯後的CSS -->
    <link rel="stylesheet" href="/build/assets/app-CS5dua3d.css">
    <link rel="stylesheet" href="/build/assets/nexus-theme-Br8IQNLI.css">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <style>
        body {
            padding: 2rem;
            background-color: var(--nexus-bg-primary);
            color: var(--nexus-text-primary);
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        .test-section {
            padding: 1.5rem;
            background-color: var(--nexus-bg-secondary);
            border-radius: 0.5rem;
            border: 1px solid var(--nexus-border-primary);
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>用戶下拉選單測試</h1>
        
        <div class="test-section">
            <h2>現代化用戶下拉選單</h2>
            <p>測試新的 CSS 類別是否正確套用</p>
            
            <!-- 現代化用戶下拉選單 -->
            <div class="relative" x-data="{ open: false }" @click.outside="open = false" @close.stop="open = false">
                <!-- 觸發器按鈕 -->
                <button @click="open = ! open" class="nexus-user-trigger-modern">
                    <!-- 用戶頭像 -->
                    <div class="nexus-user-avatar">
                        T
                    </div>
                    
                    <!-- 用戶資訊 -->
                    <div>
                        <div class="text-sm font-medium">測試用戶</div>
                        <div class="text-xs opacity-75">test@example.com</div>
                    </div>

                    <!-- 下拉箭頭 -->
                    <svg class="fill-current h-4 w-4 transition-transform duration-200" :class="{'rotate-180': open}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>

                <!-- 下拉選單 -->
                <div x-show="open"
                     x-transition:enter="transition ease-out duration-200"
                     x-transition:enter-start="opacity-0 scale-95"
                     x-transition:enter-end="opacity-100 scale-100"
                     x-transition:leave="transition ease-in duration-75"
                     x-transition:leave-start="opacity-100 scale-100"
                     x-transition:leave-end="opacity-0 scale-95"
                     class="nexus-user-dropdown-modern"
                     style="display: none;"
                     @click="open = false">
                    
                    <!-- 個人資料連結 -->
                    <a href="#" class="nexus-user-menu-item-modern">
                        <svg class="nexus-user-menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        <span>個人資料</span>
                    </a>

                    <!-- 分隔線 -->
                    <div class="nexus-user-menu-divider"></div>

                    <!-- 登出 -->
                    <button type="button" class="nexus-user-menu-item-modern w-full">
                        <svg class="nexus-user-menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                        </svg>
                        <span>登出</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="test-section">
            <h3>CSS 類別檢查</h3>
            <ul>
                <li><code>.nexus-user-trigger-modern</code> - 觸發器按鈕樣式</li>
                <li><code>.nexus-user-avatar</code> - 用戶頭像樣式</li>
                <li><code>.nexus-user-dropdown-modern</code> - 下拉選單容器</li>
                <li><code>.nexus-user-menu-item-modern</code> - 選單項目樣式</li>
                <li><code>.nexus-user-menu-icon</code> - 選單圖示</li>
                <li><code>.nexus-user-menu-divider</code> - 分隔線</li>
            </ul>
        </div>

        <div class="test-section">
            <h3>主題切換測試</h3>
            <button onclick="toggleTheme()" class="nx-btn-primary">切換主題</button>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const root = document.documentElement;
            root.classList.toggle('light-theme');
        }
    </script>
</body>
</html>
