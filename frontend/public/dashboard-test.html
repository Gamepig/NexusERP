<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儀表板測試</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
    </style>
</head>
<body>
    <h1>NexusERP 儀表板載入測試</h1>
    
    <div id="test-results"></div>
    
    <script>
        const results = document.getElementById('test-results');
        
        function addResult(type, message) {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            results.appendChild(div);
        }
        
        // 測試 1: 基礎連接
        addResult('info', '測試 1: 檢查基礎連接...');
        
        // 測試 2: JavaScript 檔案載入
        addResult('info', '測試 2: 載入 DashboardManager.js...');
        
        const script = document.createElement('script');
        script.src = '/js/components/dashboard/DashboardManager.js';
        script.onload = function() {
            addResult('success', '✓ DashboardManager.js 載入成功');
            
            // 測試 3: 檢查類別是否可用
            setTimeout(() => {
                if (typeof DashboardManager !== 'undefined') {
                    addResult('success', '✓ DashboardManager 類別可用');
                    
                    // 測試 4: 嘗試初始化
                    try {
                        const manager = new DashboardManager();
                        addResult('success', '✓ DashboardManager 初始化成功');
                    } catch (e) {
                        addResult('error', '✗ DashboardManager 初始化失敗: ' + e.message);
                    }
                } else {
                    addResult('error', '✗ DashboardManager 類別不可用');
                }
            }, 100);
        };
        
        script.onerror = function() {
            addResult('error', '✗ DashboardManager.js 載入失敗');
        };
        
        document.head.appendChild(script);
        
        // 測試 5: API 連接測試
        addResult('info', '測試 3: 檢查 API 連接...');
        
        fetch('/api/dashboard')
            .then(response => {
                if (response.status === 401) {
                    addResult('info', '→ API 端點回應 401 (需要認證) - 正常');
                } else if (response.status === 200) {
                    addResult('success', '✓ API 端點正常回應');
                } else {
                    addResult('error', `✗ API 端點異常回應: ${response.status}`);
                }
            })
            .catch(error => {
                addResult('error', '✗ API 連接失敗: ' + error.message);
            });
            
        // 監聽控制台錯誤
        window.addEventListener('error', function(e) {
            addResult('error', '✗ JavaScript 錯誤: ' + e.message);
        });
        
        addResult('info', '測試完成。請檢查上述結果。');
    </script>
</body>
</html>
